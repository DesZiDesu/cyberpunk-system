<div id="cyberpunk-system-settings" class="cps-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header interactable" tabindex="0" role="button" aria-expanded="false">
      <b>Cyberpunk System <span class="cps-version">v2.1.2</span></b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down" aria-hidden="true"></div>
    </div>
    <div class="inline-drawer-content">
      <p data-cps-i18n="settingsIntro">Characters, private calls, Cyberware, equipment, quests and Breach Protocol for the active chat.</p>
      <label class="cps-config-toggle"><span data-cps-i18n="enableSystem">Enable Cyberpunk System</span><input id="cps-enabled" type="checkbox" role="switch"><i aria-hidden="true"></i></label>
      <div class="cps-settings-actions">
        <button id="cps-open-manager" class="cps-button primary" type="button" data-cps-i18n="openInterface">Open interface</button>
        <button id="cps-open-cyberware" class="cps-button" type="button">Cyberware</button>
        <button id="cps-open-config" class="cps-button" type="button" data-cps-i18n="openConfig">Open settings</button>
      </div>
    </div>
  </div>
</div>
